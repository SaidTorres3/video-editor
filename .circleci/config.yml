version: 2.1
orbs:
  win: circleci/windows@5.1.0

jobs:
  build:
    parameters:
      static:
        type: boolean
    executor: win/server-2022
    steps:
      - checkout

      - restore_cache:
          keys:
            - qt-cache-6.6.3

      - run:
          name: Install Qt (aqtinstall)
          shell: powershell
          no_output_timeout: 2h
          command: |
            $ErrorActionPreference = "Stop"
            $qtRoot = "C:\Qt"
            $qtVersion = "6.6.3"
            $qtBase = Join-Path $qtRoot $qtVersion

            function Get-QtKitPath {
              param([string]$base)
              if (-not (Test-Path $base)) { return $null }
              $preferred = @("msvc2022_64", "msvc2019_64")
              foreach ($k in $preferred) {
                $p = Join-Path $base $k
                if (Test-Path $p) { return $p }
              }
              return $null
            }

            $qtPath = Get-QtKitPath $qtBase
            if (-not $qtPath) {
              python --version
              python -m pip install --upgrade pip
              python -m pip install aqtinstall

              $kits = @("msvc2022_64", "msvc2019_64")
              foreach ($kit in $kits) {
                Write-Host "Installing Qt $qtVersion kit: $kit"
                # Base Qt (Widgets/Core/etc) is installed by default; `-m` is only for *additional* modules.
                python -m aqt install-qt windows desktop $qtVersion ("win64_" + $kit) -O $qtRoot
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "aqt failed for kit: $kit (exit $LASTEXITCODE)"
                  continue
                }
                $qtPath = Get-QtKitPath $qtBase
                if ($qtPath) { break }
              }
            }

            $qtPath = Get-QtKitPath $qtBase
            if (-not $qtPath) {
              Write-Host "ERROR: Qt install did not produce an MSVC kit under $qtBase"
              if (Test-Path $qtRoot) { Get-ChildItem -Recurse -Depth 2 $qtRoot | Select-Object FullName }
              exit 1
            }
            Write-Host "Qt installed at: $qtPath"

      - save_cache:
          key: qt-cache-6.6.3
          paths:
            - C:/Qt/6.6.3

      # static=true
      - when:
          condition:
            equal: [ true, <<parameters.static>> ]
          steps:
            - restore_cache:
                keys:
                  - vcpkg-cache-{{ checksum "vcpkg.json.ci" }}
                  - vcpkg-cache-

            - run:
                name: Install vcpkg and dependencies
                shell: powershell
                no_output_timeout: 2h
                command: |
                  if (-not (Test-Path 'C:/tools/vcpkg')) {
                    git clone https://github.com/microsoft/vcpkg C:/tools/vcpkg
                    & C:/tools/vcpkg/bootstrap-vcpkg.bat
                  }
                  $env:VCPKG_DEFAULT_BINARY_CACHE = "C:/tools/vcpkg/bincache"
                  if (-not (Test-Path $env:VCPKG_DEFAULT_BINARY_CACHE)) {
                    New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
                  }
                  & C:/tools/vcpkg/vcpkg install ffmpeg[dav1d,openh264,x264,x265,mp3lame,opus,zlib,nvcodec,ffmpeg]:x64-windows-static
                  & C:/tools/vcpkg/vcpkg install curl[core,sspi,ssl,non-http]:x64-windows-static

            - save_cache:
                key: vcpkg-cache-{{ checksum "vcpkg.json.ci" }}
                paths:
                  - C:/tools/vcpkg
                  
      - run:
          name: Install CMake via Chocolatey
          shell: powershell
          command: |
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
            refreshenv
            cmake --version

      - run:
          name: Run build script
          shell: powershell
          command: |
            $ErrorActionPreference = "Stop"
            $qtRoot = "C:\Qt"
            $qtVersion = "6.6.3"
            $qtBase = Join-Path $qtRoot $qtVersion
            $qtPath = $null
            foreach ($kit in @("msvc2022_64", "msvc2019_64")) {
              $p = Join-Path $qtBase $kit
              if (Test-Path $p) { $qtPath = $p; break }
            }
            if (-not $qtPath) {
              Write-Host "ERROR: Qt not found under $qtBase" -ForegroundColor Red
              if (Test-Path $qtRoot) { Get-ChildItem -Recurse -Depth 2 $qtRoot | Select-Object FullName }
              exit 1
            }
            if ("<<parameters.static>>" -eq "true") {
              ./run.ps1 -Static -QtPath "$qtPath" -NoLaunch
            } else {
              ./run.ps1 -QtPath "$qtPath" -NoLaunch
            }
      # // Commented out because it consumes too much space
      # - store_artifacts:
      #     path: ./build/Release
      #     destination: release

workflows:
  ci-build:
    jobs:
      - build:
          name: build-dynamic
          static: false
      # // Commented out static build for now because it consumes too much time (and credits $$$)!
      # - build:
      #     name: build-static
      #     static: true
